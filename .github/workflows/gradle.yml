name: Java CI with Gradle

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Start SUT (replan delivery app) in background
        run: java -jar ./artifacts/app-replan-delivery.jar &

      - name: Wait for SUT to start
        run: sleep 5

      - name: Run tests with Selenide in headless mode
        run: ./gradlew test --info -Dselenide.headless=true

      - name: Upload test report on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests
          if-no-files-found: ignore